<link rel="import" href="../polymer/polymer-element.html">
<link rel="import" href="../polymer/lib/elements/dom-repeat.html">
<link rel="import" href="./granite-launchpad-switch.html">

<dom-module id="granite-launchpad">
    <template>
        <style>
            :host {
                display: block;
            }

            #switch-board {
                display: grid;
                grid-template-columns: 400px 50px;
                grid-template-rows: 50px 400px;
                grid-column-gap: 20px;
                grid-row-gap: 20px;
            }

            #main-board {
                grid-column-start: 0;
                grid-column-end: 1;
                grid-row-start: 1;
                grid-row-end: 2;
                display: grid;
                grid-template-columns: repeat(8, 50px);
                grid-template-rows: repeat(8, 50px);
                grid-column-gap: 5px;
                grid-row-gap: 5px;
            }

            #main-board granite-launchpad-switch {
                --switch-size: 50px;
            }

            #upper-row {
                grid-column-start: 0;
                grid-column-end: 1;
                grid-row-start: 0;
                grid-row-end: 1;
                display: grid;
                grid-template-columns: repeat(8, 50px);
                grid-template-rows: 50px;
                grid-column-gap: 5px;
                grid-row-gap: 5px;
            }

            #right-column {
                grid-column-start: 1;
                grid-column-end: 2;
                grid-row-start: 1;
                grid-row-end: 2;
                display: grid;
                grid-template-columns: 50px;
                grid-template-rows: repeat(8, 50px);
                grid-column-gap: 5px;
                grid-row-gap: 5px;
            }
            #upper-row granite-launchpad-switch,
            #right-column granite-launchpad-switch {
                --switch-size: 40px;
                --switch-border-radius: 20px;
                margin: 5px;
            }
        </style>
        <div id="switch-board">
            <div id="upper-row">
                <template is="dom-repeat" items="[[upperRowSwitches]]" as="switch" index-as="column">
                    <granite-launchpad-switch 
                            id="8-[[column]]" 
                            name="8-[[column]]" 
                            color="{{switch}}" 
                            on-pressed="_onUpperRowSwitchDown" 
                            on-released="_onUpperRowSwitchUp"
                            debug="[[debug]]"></granite-launchpad-switch>
                </template>                    
            </div>
            <div id="main-board">
                <template is="dom-repeat" items="[[mainBoardSwitches]]" as="rowSelector" index-as="row">
                    <template is="dom-repeat" items="[[rowSelector]]" as="switch" index-as="column">
                        <granite-launchpad-switch 
                                id="[[row]]-[[column]]" 
                                name="[[row]]-[[column]]" 
                                color="{{switch}}" 
                                on-pressed="_onMainBoardSwitchDown" 
                                on-released="_onMainBoardSwitchUp"
                                debug="[[debug]]"></granite-launchpad-switch>
                    </template>
                </template>
            </div>
            <div id="right-column">
                <template is="dom-repeat" items="[[rightColumnSwitches]]" as="switch" index-as="row">
                    <granite-launchpad-switch 
                            id="[[row]-8" 
                            name="[[row]]-8" 
                            color="{{switch}}" 
                            on-pressed="_onRightColumnSwitchDown" 
                            on-released="_onRightColumnSwitchUp"
                            debug="[[debug]]"></granite-launchpad-switch>
                </template>
                    
            </div>
        </div>
    </template>

    <script>
        /**
         * `granite-launchpad`
         * A custom element mimicking a Novation Launchpad Mini board
         *
         * @customElement
         * @polymer
         * @demo demo/index.html
         */
        class GraniteLaunchpad extends Polymer.Element {
            static get is() { return 'granite-launchpad'; }


            static get properties() {
                return {
                    mainBoardSwitches: {
                        type: Array,
                        value: () => {
                            let switchMap = Array(8);
                            [...switchMap.keys()].forEach((i) => {
                                switchMap[i] = Array(8);
                                [...switchMap[i].keys()].forEach((j) => {
                                    switchMap[i][j] = 'off';
                                });
                            });
                            return switchMap;
                        },
                    },
                    upperRowSwitches: {
                        type: Array,
                        value: () => {
                            let switchRow = Array(8);
                            [...switchRow.keys()].forEach((i) => {
                                switchRow[i] = 'off';
                            });
                            return switchRow;
                        },
                    },
                    rightColumnSwitches: {
                        type: Array,
                        value: () => {
                            let switchColumn = Array(8);
                            [...switchColumn.keys()].forEach((i) => {
                                switchColumn[i] = 'off';
                            });
                            return switchColumn;
                        },
                    },
                    /**
                     * If true, element logs operation details
                     */
                    debug: {
                        type: Boolean,
                        value: false,
                    },
                };
            }

            setColor(i, j, color) {
                if (i<0 || i>8 || j<0 || j>8 || i == j == 8) {
                    return;
                }
                if (i == 8) {
                    this.set(['upperRowSwitches', j], color);
                    return;
                }
                if (j == 8) {
                    this.set(['rightColumnSwitches', i], color);
                    return;
                }
                this.set(['mainBoardSwitches', i, j], color);
                if (this.debug) {
                    console.log(`[granite-launchpad] setMainBoardColor  ${i}-${j}`,
                            this.mainBoardSwitches[i][j]);
                }
            }

            getColor(i, j) {
                if (i<0 || i>8 || j<0 || j>8 || i == j == 8) {
                    return 'off';
                }
                if (i == 8) {
                    return this.upperRowSwitches[j];
                }
                if (j == 8) {
                    return this.rightColumnSwitches[i];
                }
                return this.mainBoardSwitches[i][j];
            }

            _onMainBoardSwitchDown(evt) {
                if (this.debug) {
                    console.log(`[granite-launchpad] _onMainBoardSwitchDown evt`, evt);
                }
                this.dispatchEvent(new CustomEvent('pressed', {
                    detail: {
                        name: evt.detail.name,
                        i: evt.model.row,
                        j: evt.model.column,
                    },
                }));
            }

            _onMainBoardSwitchUp(evt) {
                if (this.debug) {
                    console.log(`[granite-launchpad] _onMainBoardSwitchUp evt`, evt);
                }
                this.dispatchEvent(new CustomEvent('released', {
                    detail: {
                        name: evt.detail.name,
                        i: evt.model.row,
                        j: evt.model.column,
                    },
                }));
            }


            _onUpperRowSwitchDown(evt) {
                if (this.debug) {
                    console.log(`[granite-launchpad] _onUpperRowSwitchDown evt`, evt);
                }
                this.dispatchEvent(new CustomEvent('pressed', {
                    detail: {
                        name: evt.detail.name,
                        i: 8,
                        j: evt.model.column,
                    },
                }));
            }

            _onUpperRowSwitchUp(evt) {
                if (this.debug) {
                    console.log(`[granite-launchpad] _onUpperRowSwitchUp evt`, evt);
                }
                this.dispatchEvent(new CustomEvent('released', {
                    detail: {
                        name: evt.detail.name,
                        i: 8,
                        j: evt.model.column,
                    },
                }));
            }

            _onRightColumnSwitchDown(evt) {
                if (this.debug) {
                    console.log(`[granite-launchpad] _onRightColumnSwitchDown evt`, evt);
                }
                this.dispatchEvent(new CustomEvent('pressed', {
                    detail: {
                        name: evt.detail.name,
                        i: evt.model.row,
                        j: 8,
                    },
                }));
            }

            _onRightColumnSwitchUp(evt) {
                if (this.debug) {
                    console.log('[granite-launchpad] _onRightColumnSwitchUp - evt', evt);
                }
                this.dispatchEvent(new CustomEvent('released', {
                    detail: {
                        name: evt.detail.name,
                        i: evt.model.row,
                        j: 8,
                    },
                }));
            }
        }

        window.customElements.define(GraniteLaunchpad.is, GraniteLaunchpad);
    </script>
</dom-module>
