<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">

  <title>granite-launchpad-switch demo</title>

  <script src="../../webcomponentsjs/webcomponents-lite.js"></script>
  <script src='../bower_components/launchpad-webmidi/dist/launchpad-webmidi.umd.js'>
  </script>

  <link rel="import" href="../../iron-demo-helpers/demo-pages-shared-styles.html">
  <link rel="import" href="../../iron-demo-helpers/demo-snippet.html">
  <link rel="import" href="../granite-launchpad-switch.html">
  <link rel="import" href="../granite-launchpad.html">

  <custom-style>
    <style is="custom-style" include="demo-pages-shared-styles">
    </style>
  </custom-style>
</head>

<body>
  <div class="vertical-section-container centered">
    <h3>Basic granite-launchpad-switch demo</h3>
    <demo-snippet>
      <template>
        <granite-launchpad-switch id="single-pad" name="single-pad" debug></granite-launchpad-switch>
        <script>
          let singlePad = document.querySelector('#single-pad');
          singlePad.addEventListener('pressed', (evt) => {
            console.log('[outside element] Received event', evt);
            singlePad.color = 'green';
          });
          singlePad.addEventListener('released', (evt) => {
            console.log('[outside element] Received event', evt);
            singlePad.color = 'red';
          });
        </script>
      </template>
    </demo-snippet>
  </div>

  <div class="vertical-section-container centered">
    <h3>Basic granite-launchpad-switch demo</h3>
    <demo-snippet>
      <template>
        <granite-launchpad id="pad-board" debug></granite-launchpad>
          <script>
            let padBoard = document.querySelector('#pad-board');
            console.log('padBoard', padBoard);
            console.dir(padBoard);
            padBoard.addEventListener('pressed', (evt) => {
              console.log('[outside element] Received event', evt, padBoard.mainBoardPads[0][0]);
              padBoard.setColor(evt.detail.i, evt.detail.j, 'green');
            });
            padBoard.addEventListener('released', (evt) => {
              console.log('[outside element] Received event', evt);
              padBoard.setColor(evt.detail.i, evt.detail.j, 'red');
            });
          </script>
      </template>
    </demo-snippet>
  </div>

  <div class="vertical-section-container centered">
    <h3>Basic digital twin granite-launchpad-switch demo</h3>
    <h4>If you have a browser with Web MIDI API and a Novation Launchpad board, plug the board and reload...</h4>
    <demo-snippet>
      <template>
        <granite-launchpad id="pad-board-twin" debug></granite-launchpad>
          <script>

            let padBoardTwin = document.querySelector('#pad-board-twin');
            function setColor(i, j, color) {
              padBoardTwin.setColor(i, j, color);
              console.log('pad connected', padConnected, pad[color], i, j);
              if (padConnected) {
                pad.col(pad[color], [j, i]);
              }
            }

            function onPadDown(i, j) {
              setColor(i, j, 'green');
            }
            function onPadUp(i, j) {
              setColor(i, j, 'red');
            }

            /* global Launchpad */
            let pad = new Launchpad();
            let padConnected = false;
            pad.connect().then(() => { // Auto-detect Launchpad
              padConnected = true;
              [...Array(9).keys()].forEach((i) => {
                [...Array(9).keys()].forEach((j) => {
                  pad.col('off', [j, i]);
                });
              });
              pad.on('key', (k) => {
                console.log(`Key ${k.x},${k.y} down: ${k.pressed}`, k);
                // Make button red while pressed, green after pressing
                if (k.pressed) {
                  onPadDown(k.y, k.x);
                } else {
                  onPadUp(k.y, k.x);
                }
              });
            });

            padBoardTwin.addEventListener('pressed', (evt) => {
              console.log('[outside element] Received event from digital twin', evt);
              console.log(padBoardTwin.getColor(evt.detail.i, evt.detail.j));
              onPadDown(evt.detail.i, evt.detail.j);
            });
            padBoardTwin.addEventListener('released', (evt) => {
              console.log('[outside element] Received event from digital twin', evt);
              onPadUp(evt.detail.i, evt.detail.j);
            });
          </script>
      </template>
    </demo-snippet>
  </div>
</body>

</html>
