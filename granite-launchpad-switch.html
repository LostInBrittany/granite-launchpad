<link rel="import" href="../polymer/polymer-element.html">

<dom-module id="granite-launchpad-switch">
  <template>
    <style>
      :host {
        display: block;
        --switch-color-off: grey;
        --switch-color-amber: orange;
        --switch-color-green: green;
        --switch-color-red: red;
      }
      #switch {
        width: var(--switch-size, 100px);
        height: var(--switch-size, 100px);
        border-radius: var(--switch-border-radius, 5px);
        background-color: var(--switch-color, var(--switch-color-off));
      }
    </style>
    <div 
        id="switch" 
        on-mousedown="_onSwitchDown" 
        on-mouseup="_onSwitchUp" 
        on-mouseout="_onSwitchOut"></div>
  </template>

  <script>
    /**
     * `granite-launchpad-switch`
     * A custom element mimicking a Novation Launchpad Mini switch
     *
     * @customElement
     * @polymer
     * @demo demo/index.html
     */
    class GraniteLaunchpadSwitch extends Polymer.Element {
      static get is() { return 'granite-launchpad-switch'; }

      /**
        * Fired when the switch color changes
        *
        * @event color-changed
        */

      /**
        * Fired when the switch is pressed
        *
        * @event pressed
        */


      /**
        * Fired when the switch is released
        *
        * @event released
        */
    
      static get properties() {
        return {
          /**
           * Element instance name
           */
          name: {
            type: String,
            value: '',
          },
          /**
           * One of `red`, `green`, `amber`, `yellow` or `off`
           */
          color: {
            type: String,
            value: '',
            notify: true,
            reflect: true,
            observer: '_onColorChange',
          },
          /**
           * If true, element logs operation details
           */
          debug: {
            type: Boolean,
            value: false,
          },
          _isMouseDown: {
            type: Boolean,
            value: false,
          },
          _validColors: {
            type: Array,
            value: [`red`, `green`, `amber`, `yellow`, `off`],
          },
        };
      }

      _onColorChange() {
        if (this.debug) {
          console.log('[granite-launchpad-switch] _onColorChange ', `color:${this.color}`);
        }
        if (this._validColors.indexOf(this.color) < 0 ) {
          this.color = 'off';
          return;
        }
        this.updateStyles({'--switch-color': `var(--switch-color-${this.color}`});
      }

      _onSwitchDown() {
        if (this.debug) {
          console.log('[granite-launchpad-switch] _onSwitchDown ', `name:${this.name}`);
        }
        this._isMouseDown = true;
        this.dispatchEvent(new CustomEvent('pressed', {
            detail: {
              name: this.name,
            },
        }));
      }

      _onSwitchUp() {
        if (this.debug) {
          console.log('[granite-launchpad-switch] _onSwitchUp ', `name:${this.name}`);
        }
        this._isMouseDown = false;
        this.dispatchEvent(new CustomEvent('released', {
            detail: {
              name: this.name,
            },
        }));
      }

      _onSwitchOut() {
        if (!this._isMouseDown) {
          return;
        }
        if (this.debug) {
          console.log('[granite-launchpad-switch] _onSwitchOut ',
              `name:${this.name}`, 'Mouse out while mouse down');
        }
        this._onSwitchUp();
      }
    }

    window.customElements.define(GraniteLaunchpadSwitch.is, GraniteLaunchpadSwitch);
  </script>
</dom-module>
